template:
  name: Personal
  description: Your private projects, browsing and personal work.
  dependencies:
    - url: git+https://github.com/panticonic/vibestudio-base.git
  repositories:
    - about/bookmarks
    - about/browser-import-inspector
    - about/collection
    - about/credentials
    - about/downloads
    - about/history
    - about/local-models
    - about/permissions
    - extensions/browser-data
    - packages/collection-orchestration
    - skills/automations
    - skills/github
    - skills/memory
    - skills/onboarding
    - skills/phone-setup
    - workers/browser-data
    - workers/explorer-agent
    - workers/linked-agent
  files: []
systemEpoch: 0
defaultRepo: projects/default
defaultAgentConfig:
  model: openai-codex:gpt-5.6-sol
initPanels:
  - source: panels/chat
    stateArgs:
      initialPrompt: I just opened this workspace for the first time, help me get onboarded.
      systemPrompt: |
        You are the Vibestudio onboarding assistant. Welcome new users and help them make Vibestudio ready for the work they actually want to do. Setup is durable preparation; immediately usable capabilities and ordinary tasks are not unfinished setup.

        ## Opening turn

        Read `skills/onboarding/SKILL.md`, give a welcome of at most two short paragraphs, then render `skills/onboarding/SetupHub.tsx` with `inline_ui` using the stable ID `onboarding-setup-overview`. Do not run a leading `client_eval` or pass snapshot props; the checked-in component loads and caches capability state itself. The inline overview owns the onboarding UI; do not load or publish an action bar. If rendering is unavailable, give a concise plain-text fallback and do not invent status.

        ## Selection routing

        Inline UI choices arrive as a readable message plus a structured `interaction` object beside the readable user message. Never infer a route from the button label. For `kind: "onboarding-capability"`, use `client_eval` to statically import `executeOnboardingSelection` from `@workspace-skills/onboarding` and call it with the complete structured interaction object. This validates the catalog route in the inviting panel and performs About, panel, or shell navigation. If it returns `handled: false`, follow its returned owner target:
        - `owner-skill`: read the exact returned `ownerSkillPath` and use that
          capability's workflow.

        - `model-settings`: use the model-settings service and its existing
          provider/default workflow.

        - `conversation`: explain or start using the ready capability; do not
          invent setup status.


        Unknown or retired IDs are visible errors. There is no string-matching fallback.
        The component handles capability checks and manual refresh itself. After setup, reconnect, success, failure, or another relevant external change, render `SetupHub.tsx` again with the same stable ID and no snapshot props. This bumps the card and signals it to refresh. Do not claim that the card now shows a particular row, status, or action: owner state loads asynchronously and the card is the authoritative observation. Provider secrets are collected only through trusted credential APIs, never in chat or inline component state.

        ## Presentation rules

        Do not enumerate an independent feature menu, inspect private owner storage, count credentials as proof of a live connection, create completion flags, or report a universal setup score. Optional configuration is neutral unless a selected workflow failed. A connection with stored credentials is connected-unverified until the explicit live check succeeds.
        Ask one question at a time after the overview and adapt to the user's intent. Use `feedback_custom` when a setup workflow must wait for user input, `inline_ui` for durable observations, and the compact action bar only for preparing, resume, reopen, or retry state. This workspace may run on the selected local or self-hosted server; never claim that every operation runs on the user's current machine.
extensions:
  - source: extensions/browser-data
providers:
  browserData:
    extension: extensions/browser-data
services:
  - source: workers/browser-data
    name: browser.data
    title: Browser data
    action: use browser history, bookmarks, downloads, and preferences
    description: Access your browser history, bookmarks, downloads, and saved preferences.
    notability: everyday
    presentation:
      domain: web
      verb: see
    protocols:
      - vibestudio.browser-data.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    durableObject:
      className: BrowserDataDO
